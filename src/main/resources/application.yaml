server:
  port: ${SERVER_PORT:8087}
  servlet:
    context-path: /
    session:
      timeout: 3600 # redefine default 30m by 1 hour

info:
  app:
    name: ti-document-agent
    version: '@project.version@'

http:
  client:
    connect-timeout: ${HTTP_CLIENT_CONNECT_TIMEOUT:5000}
    read-timeout: ${HTTP_CLIENT_READ_TIMEOUT:120000}

spring:
  application:
    name: ${info.app.name}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://${OKTA_DOMAIN}/
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: assistant
        hbm2ddl:
          auto: none
          jdbc:
            batch_size: 30
    hibernate:
      # turn off the hibernate auto-creation of the tables from the entity objects
      ddl-auto: none
    open-in-view: false
  datasource:
    hikari:
      minimum-idle: 5
      connection-timeout: 50000    # 60s (don’t let threads hang for 5 minutes)
      leak-detection-threshold: 20000 # 20s, temporary during investigation
      max-lifetime: 1800000        # 30m default-ish, keep explicit
      idle-timeout: 600000         # 10m
    url: ${ASSISTANT_DB_URL:jdbc:postgresql://localhost:5434/assistant_db}
    driverClassName: org.postgresql.Driver
    username: ${ASSISTANT_USER:assistant_user}
    password: ${ASSISTANT_PASSWORD:qwerty}
  ai:
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024 # 768 for postgresMl
        initialize-schema: false
        schema-name: public
        table-name: vector_store
        max-document-batch-size: 10000

    mistralai:
      api-key: ${MISTRAL_AI_API_KEY}
    openai:
      api-key: ${OPEN_AI_API_KEY}
      #base-url: ${OPEN_AI_ENDPOINT:https://ai-proxy.lab.epam.com/openai/deployments/gpt-4.1-mini-2025-04-14}
      chat:
        model: "${CHAT_MODEL:gpt-4.1-mini-2025-04-14}" # gpt-4-turbo
        base-url: ${OPEN_AI_ENDPOINT:https://ai-proxy.lab.epam.com/openai/deployments/gpt-4.1-mini-2025-04-14}
        temperature: 0.7
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 4000ms
      on-client-errors: true
    timeout: 40000ms

datasource:
  pgvector:
    jdbcUrl: "${DOCUMENT_DB_URL:jdbc:postgresql://localhost:5433/document_db}" #?stringtype=unspecified # 5433
    username: ${DOCUMENT_USER:postgres}
    password: ${DOCUMENT_PASSWORD:postgres}
    driverClassName: org.postgresql.Driver

ms:
  cors:
    allowed-origins: "${SWAGGER_ALLOWED_ORIGINS:http://localhost:8080}"

group:
  admin: ${ADMINS}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,zipkin
  endpoint:
    prometheus:
      access: read_only
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      zipkin:
        enabled: true
        endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  level:
    com.wk.ti: debug
    org.springframework: info
  # Enable Native JSON Structured Logging (Spring Boot 3.4+)
  structured:
    format:
      console: ecs # Emits logs in ECS JSON format containing service, traceId, spanId

springdoc:
  api-docs:
    path: /v3/api-docs

