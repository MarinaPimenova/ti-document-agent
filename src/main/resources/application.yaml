server:
  port: ${SERVER_PORT:8087}
  servlet:
    context-path: /
    session:
      timeout: 3600 # redefine default 30m by 1 hour

info:
  app:
    name: ti-document-agent
    version: '@project.version@'

spring:
  application:
    name: ${info.app.name}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://${OKTA_DOMAIN}/

  ai:
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024 # 768 for postgresMl
        initialize-schema: false
        schema-name: public
        table-name: vector_store
        max-document-batch-size: 10000
    mistralai:
      api-key: ${MISTRAL_AI_API_KEY}
    openai:
      api-key: ${OPEN_AI_API_KEY}
      base-url: ${OPEN_AI_ENDPOINT:https://ai-proxy.lab.epam.com}
      chat:
        completions-path: "${OPEN_AI_COMPLETIONS_PATH:/openai/deployments/gpt-4.1-mini-2025-04-14/chat/completions}"
        model: "${CHAT_MODEL:gpt-4.1-mini-2025-04-14}" # gpt-4-turbo
        base-url: ${OPEN_AI_ENDPOINT:https://ai-proxy.lab.epam.com}
        embeddings-path: /openai/deployments/text-embedding-ada-002/embeddings
  datasource:
    driverClassName: org.postgresql.Driver
    jdbcUrl: ${datasource.pgvector.url}
    username: ${datasource.pgvector.username}
    password: ${datasource.pgvector.password}

openai:
  image-model: "${IMAGE_MODEL:anthropic.claude-v3-haiku}" #gpt-4-vision-preview
  image-completions-path: "${IMAGE_AI_COMPLETIONS_PATH:/openai/deployments/anthropic.claude-v3-haiku/chat/completions}"

datasource:
  pgvector:
    jdbcUrl: "${PGVECTOR_URL:jdbc:postgresql://localhost:5433/document_db}" #?stringtype=unspecified # 5433
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driverClassName: org.postgresql.Driver

ms:
  cors:
    allowed-origins: "${SWAGGER_ALLOWED_ORIGINS:http://localhost:8080}"

group:
  admin: ${ADMINS}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,zipkin
  endpoint:
    prometheus:
      access: read_only
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      zipkin:
        enabled: true
        endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  level:
    com.wk.ti: debug
    org.springframework: info
  # Enable Native JSON Structured Logging (Spring Boot 3.4+)
  structured:
    format:
      console: ecs # Emits logs in ECS JSON format containing service, traceId, spanId

springdoc:
  api-docs:
    path: /v3/api-docs

